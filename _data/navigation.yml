# Top navigation bar.
# Links starting with "/#" jump to a section on the homepage.
# `section:` (optional) hides the link on the live site until that
# _data/<section>.yml file has at least one entry without `todo: true`.
main:
  - title: "Publications"
    url: /publications/

  - title: "Awards"
    url: /#awards
    section: awards

  - title: "Teaching"
    url: /#teaching
    section: teaching

  - title: "Service"
    url: /#service
    section: service

  - title: "CV"
    url: /files/CV_03262023.pdf
